<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; background: #DEDCD5; }
  @media (prefers-color-scheme: dark) { html:not([data-theme="light"]), html:not([data-theme="light"]) body { background: #15181A; } }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>Klèrôtèrion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style>
  :root {
    --marbre:        #DEDCD5;
    --surface:       #EAE8E2;
    --surface-creux: #D2CFC6;
    --creux:         #C3BFB5;
    --trait:         #C9C5BB;
    --gravure:       #23262A;
    --gravure-doux:  #5F656A;
    --patine:        #46705F;
    --patine-voile:  #46705F26;
    --terre:         #A8552F;
    --bille-noire:   #2F3438;
    --bille-blanche: #FBFAF6;
    --ombre:         0 1px 2px #23262A14;
    --fond-opacite:  .50;
    --fond-lumiere:  1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --marbre:        #15181A;
      --surface:       #202427;
      --surface-creux: #191D20;
      --creux:         #2B3034;
      --trait:         #333A3E;
      --gravure:       #E4E2DB;
      --gravure-doux:  #9AA0A5;
      --patine:        #74A992;
      --patine-voile:  #74A9922E;
      --terre:         #CB7B4F;
      --bille-noire:   #14181B;
      --bille-blanche: #EFEDE6;
      --ombre:         0 1px 2px #00000040;
      --fond-opacite:  .38;
      --fond-lumiere:  .7;
    }
  }
  :root[data-theme="dark"] {
    --marbre:        #15181A;
    --surface:       #202427;
    --surface-creux: #191D20;
    --creux:         #2B3034;
    --trait:         #333A3E;
    --gravure:       #E4E2DB;
    --gravure-doux:  #9AA0A5;
    --patine:        #74A992;
    --patine-voile:  #74A9922E;
    --terre:         #CB7B4F;
    --bille-noire:   #14181B;
    --bille-blanche: #EFEDE6;
    --ombre:         0 1px 2px #00000040;
    --fond-opacite:  .38;
    --fond-lumiere:  .7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--marbre);
    color: var(--gravure);
    font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  .page {
    max-width: 1180px;
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 32px 56px;
  }




  /* ---------- pupitre : une seule ligne sous la machine ---------- */

  .pupitre {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
    margin-top: 16px;
  }

  .reglages { display: flex; flex-direction: column; gap: 18px; }

  .champ { display: flex; flex-direction: column; gap: 6px; }

  label, .legende {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gravure-doux);
  }

  input[type="number"] {
    width: 72px;
    padding: 8px 9px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--gravure);
    background: var(--surface);
    border: 1px solid var(--trait);
    border-radius: 3px;
  }

  input:focus-visible, button:focus-visible {
    outline: 2px solid var(--patine);
    outline-offset: 2px;
  }

  .bilan {
    font-size: 13px;
    color: var(--gravure-doux);
    border-left: 2px solid var(--patine);
    padding: 2px 0 2px 11px;
    margin: 0;
  }

  .bilan strong { color: var(--gravure); font-weight: 600; font-variant-numeric: tabular-nums; }
  .bilan.alerte { border-left-color: var(--terre); }
  .bilan.alerte strong { color: var(--terre); }


  button {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    padding: 10px 16px;
    border-radius: 3px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color .15s, border-color .15s;
  }

  .btn-tirer { background: var(--patine); color: var(--bille-blanche); }
  .btn-tirer:hover:not(:disabled) { filter: brightness(1.08); }

  .btn-second { background: transparent; color: var(--gravure); border-color: var(--trait); }
  .btn-second:hover:not(:disabled) { border-color: var(--gravure-doux); }

  button:disabled { opacity: .4; cursor: default; }

  .compte {
    font-size: 13px;
    color: var(--gravure-doux);
    padding-bottom: 10px;
    font-variant-numeric: tabular-nums;
  }

  .compte strong { color: var(--gravure); font-weight: 600; }

  /* ---------- la machine, posée sur la pierre ---------- */

  .machine {
    margin-top: 0;
    position: relative;
    isolation: isolate;
    border: 1px solid var(--trait);
    border-radius: 4px;
    padding: 20px;
    box-shadow: var(--ombre);
    overflow: hidden;
    background: var(--surface);
  }

    opacity: var(--fond-opacite);
    filter: grayscale(.3) contrast(1.05) brightness(var(--fond-lumiere));
  }

  .tetes, .rangee {
    display: grid;
    /* la fente s'arrête à la longueur d'un nom : la pierre reste visible autour */
    grid-template-columns: 26px 30px repeat(var(--tribus), minmax(0, 155px));
    gap: 5px;
    justify-content: center;
  }

  .tetes { margin-bottom: 9px; }

  .tete {
    font-family: Cinzel, serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.05em;
    text-align: center;
    color: var(--gravure);
    padding-bottom: 6px;
    border-bottom: 1px solid var(--trait);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .rangees { display: grid; gap: 4px; justify-content: center; }

  /* au-delà de 15 rangées d'une seule fente, la plaque se lit sur deux flux */
  .rangees.deux-flux {
    grid-auto-flow: column;
    grid-template-rows: repeat(var(--par-flux), auto);
    column-gap: 22px;
  }

  @media (max-width: 720px) {
    .rangees.deux-flux { grid-auto-flow: row; grid-template-rows: none; }
  }

  .rangee {
    align-items: stretch;
    border-radius: 3px;
    padding: 2px;
    transition: background-color .25s, opacity .25s;
  }

  .rangee[data-etat="retenue"] { background: var(--patine-voile); }
  .rangee[data-etat="rejetee"] { opacity: .3; }
  .rangee[data-etat="courante"] { background: var(--surface-creux); }

  .numero {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11.5px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--gravure);
    padding-right: 2px;
  }

  .logement { display: flex; align-items: center; justify-content: center; }

  .bille {
    width: 17px;
    height: 17px;
    border-radius: 50%;
    border: 1px solid var(--trait);
    flex: none;
  }

  .bille.blanche { background: var(--bille-blanche); }
  .bille.noire   { background: var(--bille-noire); border-color: var(--bille-noire); }
  .bille.tombe   { animation: chute .28s ease-out; }

  @keyframes chute {
    from { transform: translateY(-14px); opacity: 0; }
    to   { transform: none; opacity: 1; }
  }

  .fente {
    background: var(--surface-creux);
    border: 1px solid var(--creux);
    border-radius: 2px;
    min-height: 30px;
    display: flex;
    align-items: center;
    padding: 3px 8px;
  }

  .fente.vide { border-style: dashed; background: transparent; }

  .pinakion {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 12.5px;
    color: var(--gravure);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .rangee[data-etat="retenue"] .pinakion { color: var(--patine); font-weight: 500; }

  /* ---------- le tube ---------- */

  .tube-bloc {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--trait);
  }

  .tube {
    display: flex;
    gap: 5px;
    padding: 6px 9px;
    background: var(--surface-creux);
    border: 1px solid var(--creux);
    border-radius: 20px;
    min-height: 31px;
    align-items: center;
    flex-wrap: wrap;
  }

  .tube:empty::after {
    content: "tube vidé";
    font-size: 11px;
    color: var(--gravure-doux);
    letter-spacing: .04em;
  }

  .credit {
    margin: 10px 0 0;
    font-size: 11px;
    color: var(--gravure-doux);
  }

  .credit a { color: inherit; }

  /* ---------- résultat ---------- */

  .resultat { margin-top: 28px; }

  .tires {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0 0;
    padding: 0;
    list-style: none;
  }

  .tires li {
    display: flex;
    align-items: baseline;
    gap: 9px;
    font-family: "IBM Plex Mono", monospace;
    font-size: 13px;
    padding: 6px 13px;
    background: var(--patine-voile);
    border: 1px solid var(--patine);
    border-radius: 3px;
    color: var(--patine);
    font-weight: 500;
  }

  .tires .rang {
    font-size: 10px;
    letter-spacing: .08em;
    opacity: .75;
    font-variant-numeric: tabular-nums;
  }

  .vide-message { color: var(--gravure-doux); font-size: 14px; margin: 10px 0 0; }


  @media (prefers-reduced-motion: reduce) {
    *, ::before, ::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>

</head>
<body>
<div class="page">


  <div class="machine">
    <div class="tetes" id="tetes"></div>
    <div class="rangees" id="rangees"></div>
    <div class="tube-bloc">
      <span class="legende">Tube</span>
      <div class="tube" id="tube"></div>
    </div>
  </div>

  <div class="pupitre">
    <div class="champ">
      <label for="blanches">Billes blanches</label>
      <input type="number" id="blanches" min="0" step="1" value="4">
    </div>
    <div class="champ">
      <label for="tribus">Colonnes</label>
      <input type="number" id="tribus" min="1" max="10" step="1" value="1">
    </div>
    <button class="btn-tirer" id="btn-tirer" type="button">Lancer le tirage</button>
    <button class="btn-second" id="btn-melanger" type="button">Remélanger</button>
    <span class="compte" id="compte"></span>
  </div>

  <section class="resultat" aria-live="polite">
    <span class="legende">Tirés au sort</span>
    <p class="vide-message" id="vide-message">Le tube est chargé. Lance le tirage pour libérer les billes.</p>
    <ul class="tires" id="tires"></ul>
  </section>

  <p class="credit">
    Fond&nbsp;: klèrôtèrion du Musée de l'Agora antique d'Athènes — photo
    <a href="https://commons.wikimedia.org/wiki/File:AGMA_Kleroterion_1.jpg" target="_blank" rel="noopener">Sharon Mollerus</a>,
    <a href="https://creativecommons.org/licenses/by/2.0" target="_blank" rel="noopener">CC BY 2.0</a>.
  </p>

</div>

<script>
  "use strict";

  var TRIBUS = ["Érechthéis", "Égéis", "Pandionis", "Léontis", "Acamantis",
                "Œnéis", "Cécropis", "Hippothontis", "Æantis", "Antiochis"];

  var NOMS = [
      "Luna A.",
    "Aaron A.",
    "Nicolás B.",
    "Felipe B.",
    "Emily B.",
    "Alegría B.",
    "Martina C.",
    "Paula C.",
    "Alejandro C.",
    "Manuela D.",
    "Daniel F.",
    "Paula G.",
    "Louis G.",
    "Emilio G.",
    "Carolina H.",
    "Helena H.",
    "Aarón I.",
    "Bernardo O.",
    "Matias P.",
    "Mateo Q.",
    "Melissa R.",
    "Isabel S.",
    "Valérie S.",
    "Samuel T.",
    "Sebastián V."
  ];


  var el = {
    tribus: document.getElementById("tribus"),
    blanches: document.getElementById("blanches"),
    tetes: document.getElementById("tetes"),
    rangees: document.getElementById("rangees"),
    tube: document.getElementById("tube"),
    compte: document.getElementById("compte"),
    tires: document.getElementById("tires"),
    videMessage: document.getElementById("vide-message"),
    btnTirer: document.getElementById("btn-tirer"),
    btnMelanger: document.getElementById("btn-melanger"),
    machine: document.querySelector(".machine")
  };

  var grille = [];
  var enCours = false;

  function hasard(n) {
    var buf = new Uint32Array(1);
    var limite = Math.floor(4294967296 / n) * n;
    do { crypto.getRandomValues(buf); } while (buf[0] >= limite);
    return buf[0] % n;
  }

  function melanger(liste) {
    var copie = liste.slice();
    for (var i = copie.length - 1; i > 0; i--) {
      var j = hasard(i + 1);
      var t = copie[i]; copie[i] = copie[j]; copie[j] = t;
    }
    return copie;
  }

  function lireNoms() {
    return NOMS;
  }

  function nbColonnes() {
    return Math.max(1, Math.min(10, parseInt(el.tribus.value, 10) || 1));
  }

  function nbBlanches() {
    return Math.max(0, Math.min(grille.length, parseInt(el.blanches.value, 10) || 0));
  }

  function construire() {
    var noms = melanger(lireNoms());
    var colonnes = nbColonnes();
    var rangs = Math.max(1, Math.ceil(noms.length / colonnes));

    grille = [];
    for (var r = 0; r < rangs; r++) {
      var ligne = [];
      for (var c = 0; c < colonnes; c++) {
        var i = c * rangs + r;
        ligne.push(i < noms.length ? noms[i] : null);
      }
      grille.push(ligne);
    }

    el.blanches.max = String(rangs);
    if (parseInt(el.blanches.value, 10) > rangs) el.blanches.value = String(rangs);


    rendre(colonnes);
    chargerTube(null);
    viderResultat();
    majCompte();
  }

  function rendre(colonnes) {
    el.machine.style.setProperty("--tribus", colonnes);

    // une seule colonne et beaucoup de rangées : on lit la plaque sur deux flux
    var deuxFlux = colonnes === 1 && grille.length > 15;
    el.rangees.classList.toggle("deux-flux", deuxFlux);
    if (deuxFlux) {
      el.rangees.style.setProperty("--par-flux", Math.ceil(grille.length / 2));
    }

    el.tetes.innerHTML = "";
    el.tetes.hidden = colonnes < 2;
    if (colonnes >= 2) {
      el.tetes.appendChild(document.createElement("div"));
      el.tetes.appendChild(document.createElement("div"));
      for (var c = 0; c < colonnes; c++) {
        var t = document.createElement("div");
        t.className = "tete";
        t.textContent = TRIBUS[c] || ("Tribu " + (c + 1));
        el.tetes.appendChild(t);
      }
    }

    el.rangees.innerHTML = "";
    grille.forEach(function (ligne, r) {
      var rangee = document.createElement("div");
      rangee.className = "rangee";
      rangee.id = "rangee-" + r;

      var numero = document.createElement("div");
      numero.className = "numero";
      numero.textContent = r + 1;
      rangee.appendChild(numero);

      var logement = document.createElement("div");
      logement.className = "logement";
      rangee.appendChild(logement);

      ligne.forEach(function (nom) {
        var fente = document.createElement("div");
        fente.className = nom ? "fente" : "fente vide";
        if (nom) {
          var p = document.createElement("span");
          p.className = "pinakion";
          p.textContent = nom;
          fente.appendChild(p);
        }
        rangee.appendChild(fente);
      });

      el.rangees.appendChild(rangee);
    });
  }

  function chargerTube(ordre) {
    var blanches = nbBlanches();
    el.tube.innerHTML = "";
    for (var i = 0; i < grille.length; i++) {
      var b = document.createElement("span");
      // au repos on montre la composition du tube, pas l'ordre : il n'est pas encore tiré
      b.className = "bille " + (ordre ? ordre[i] : (i < blanches ? "blanche" : "noire"));
      el.tube.appendChild(b);
    }
  }


  function majCompte() {
    var colonnes = nbColonnes();
    var attendu = nbBlanches() * colonnes;
    var incompletes = grille.some(function (l) {
      return l.some(function (n) { return !n; });
    });
    el.compte.innerHTML = "→ " + (incompletes ? "jusqu'à " : "") +
                          "<strong>" + attendu + "</strong> tiré" + (attendu > 1 ? "s" : "");
  }

  function viderResultat() {
    el.tires.innerHTML = "";
    el.videMessage.hidden = false;
    el.videMessage.textContent = "Le tube est chargé. Lance le tirage pour libérer les billes.";
    grille.forEach(function (_, r) {
      var rangee = document.getElementById("rangee-" + r);
      if (rangee) {
        rangee.removeAttribute("data-etat");
        rangee.querySelector(".logement").innerHTML = "";
      }
    });
  }

  function pause(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }

  async function tirer() {
    if (enCours || !grille.length) return;
    enCours = true;
    el.btnTirer.disabled = true;
    el.btnMelanger.disabled = true;
    viderResultat();
    el.videMessage.textContent = "Les billes tombent…";

    var blanches = nbBlanches();
    var ordre = [];
    for (var i = 0; i < grille.length; i++) ordre.push(i < blanches ? "blanche" : "noire");
    ordre = melanger(ordre);
    chargerTube(ordre);

    var rapide = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var attente = rapide ? 8 : Math.max(150, Math.round(4200 / grille.length));
    var retenus = [];

    for (var r = 0; r < grille.length; r++) {
      var rangee = document.getElementById("rangee-" + r);
      rangee.setAttribute("data-etat", "courante");
      await pause(attente * 0.4);

      if (el.tube.firstChild) el.tube.removeChild(el.tube.firstChild);
      var bille = document.createElement("span");
      bille.className = "bille tombe " + ordre[r];
      rangee.querySelector(".logement").appendChild(bille);

      if (ordre[r] === "blanche") {
        rangee.setAttribute("data-etat", "retenue");
        grille[r].forEach(function (nom) { if (nom) retenus.push(nom); });
      } else {
        rangee.setAttribute("data-etat", "rejetee");
      }
      await pause(attente * 0.6);
    }

    el.tires.innerHTML = "";
    retenus.forEach(function (nom, i) {
      var li = document.createElement("li");
      var rang = document.createElement("span");
      rang.className = "rang";
      rang.textContent = (i + 1) + (i === 0 ? "ᵉʳ" : "ᵉ");
      li.appendChild(rang);
      li.appendChild(document.createTextNode(nom));
      el.tires.appendChild(li);
    });

    el.videMessage.hidden = retenus.length > 0;
    if (!retenus.length) el.videMessage.textContent = "Aucune bille blanche : personne n'est tiré.";

    el.btnTirer.disabled = false;
    el.btnMelanger.disabled = false;
    enCours = false;
  }

  // ---------- démarrage ----------

  el.tribus.addEventListener("input", construire);
  el.btnMelanger.addEventListener("click", construire);
  el.btnTirer.addEventListener("click", tirer);

  construire();
</script>
</body>
</html>
